# Dependabot config: monthly, one grouped PR for GitHub Actions (keeps the commit SHA pins current).
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  cooldown:
    default-days: 3
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  labels:
  - dependencies
  assignees:
  - Jonasdero
  groups:
    all-dependencies:
      patterns:
      - '*'
